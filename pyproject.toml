[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetpilot"
version = "0.1.0"
description = "A budget-aware decision engine for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aleena Antony" },
    { name = "Adithyan Biju" },
]
dependencies = [
    "ollama",
    "mcp>=2.0.0",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "pyyaml",
    "pytest",
]

[project.scripts]
bp = "budgetpilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["budgetpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
