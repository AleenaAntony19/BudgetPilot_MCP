[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetpilot"
version = "2.0.0"
description = "MCP server and Claude Code hook engine that cuts the token cost of coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aleena Antony" },
    { name = "Adithyan Biju" },
]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
    "pyyaml",
]

[project.optional-dependencies]
local = ["ollama"]
api = ["fastapi", "uvicorn"]
dev = ["pytest"]
# `bp gateway` uses the standard library only; the extra exists so `pip install "budgetpilot[gateway]"` works.
gateway = []

[project.scripts]
bp = "budgetpilot.cli:main"
budgetpilot-mcp = "budgetpilot.adapters.mcp_server:run_server"
budgetpilot-hook = "budgetpilot.adapters.hooks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["budgetpilot*"]

[tool.setuptools.package-data]
budgetpilot = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
